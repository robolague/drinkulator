apiVersion: v1
kind: ConfigMap
metadata:
  name: drinkulator-config
data:
  FLASK_APP: main
  FLASK_ENV: production
  PORT: "5000"
---
apiVersion: v1
kind: Pod
metadata:
  name: drinkulator
  labels:
    app: drink-calculator
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "5000"
spec:
  containers:
    - name: drinkulator
      image: ghcr.io/your-org/drinkulator:latest
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 5000
          name: http
      envFrom:
        - configMapRef:
            name: drinkulator-config
      readinessProbe:
        httpGet:
          path: /
          port: http
        initialDelaySeconds: 3
        periodSeconds: 10
      livenessProbe:
        httpGet:
          path: /
          port: http
        initialDelaySeconds: 10
        periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: drink-calculator
  labels:
    app: drink-calculator
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "5000"
spec:
  selector:
    app: drink-calculator
  ports:
    - name: http
      port: 5000
      targetPort: http
