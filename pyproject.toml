[project]
name = "drink-calculator"
version = "0.1.0"
description = "Scale single-drink measurements for a 5-gallon cooler"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["flask"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.15.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
