[project]
name = "drink-calculator"
version = "0.1.0"
description = "Scale single-drink measurements for a cooler (default 5 gallons)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "flask",
    "prometheus-client>=0.25.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "ruff>=0.15.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
