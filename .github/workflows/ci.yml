name: CI

on:
  pull_request:
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/**"
  push:
    branches:
      - master
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
      uses: actions/checkout@v4

      - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

      - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: pyproject.toml

      - name: Install dependencies
      run: uv sync --all-groups --frozen

      - name: Lint
      run: uv run ruff check .

      - name: Run tests
      run: uv run pytest -q
